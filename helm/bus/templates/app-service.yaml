# step3.12 — 템플릿: 중괄호 두 겹 자리만 values.yaml 값으로 채운다 (나머지는 k8s/step3 원본 그대로)
# step3.5 — 이름 app 으로 APP 에 접속 (web 이미지의 기본값 APP_ADDR=app:8000 그대로)
#   ClusterIP : 클러스터 안에서만. 밖에서는 web(Nginx)을 거쳐야 한다
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: app
  ports:
  - name: http
    port: 8000
    targetPort: http
