# Web: 화면 파일은 Nginx가 직접 응답하고, /api 요청만 WAS로 넘긴다.
server {
    listen 80;

    # 화면 파일 (index.html)
    root /var/www/bus-app;
    index index.html;

    # API 요청은 WAS로 전달 (로컬: 같은 PC의 8000번 포트)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
