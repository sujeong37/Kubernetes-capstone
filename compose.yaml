# ============================================================================
# step2.4 Docker Compose — db · app · web 를 파일 하나로 띄운다
# docker/up.sh(docker run 3번 + 대기 함수)가 하던 일을 "원하는 상태"로 적었다.
#
#   bash docker/compose-up.sh              → 비밀번호 입력 → docker compose up -d --wait
#   docker compose ps / logs app / down    → 상태 · 로그 · 정리 (볼륨은 남는다)
#   IMAGE_PREFIX=sujeong79/ docker compose up -d --wait   → Docker Hub 이미지로
#
# 비밀 값(DB 비밀번호 · 인증키)은 이 파일에 적지 않는다. 실행하는 셸의 환경 변수에서 읽는다.
#   ${DB_PASSWORD:?...} : 값이 없으면 안내 문구를 내고 멈춘다
# ============================================================================

name: bus

# 세 서비스가 같이 쓰는 설정 (x- 로 시작하는 칸은 Compose가 무시한다 → 앵커로 재사용)
x-common: &common
  restart: unless-stopped

services:
  db:
    <<: *common
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD 가 없습니다. read -rsp 로 입력 후 export 하세요}
      MYSQL_DATABASE: busdb
      MYSQL_USER: bus
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 없습니다. read -rsp 로 입력 후 export 하세요}
    volumes:
      - db-data:/var/lib/mysql                          # 데이터 (step2.0 부터 쓰던 볼륨 그대로)
      - ./app/db:/docker-entrypoint-initdb.d:ro         # 빈 볼륨일 때만 실행: 테이블 · 권한
    healthcheck:                                       # up.sh 의 --health-cmd 와 같다
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      retries: 40
    # 포트는 밖으로 열지 않는다 (app 만 같은 네트워크에서 접속)

  app:
    <<: *common
    image: ${IMAGE_PREFIX:-}bus-app:${IMAGE_TAG:-step2.3}
    build: ./app/was                                   # docker compose build 로 만들 때
    env_file: docker/env.docker                        # 비밀이 아닌 공통 설정 (DB_HOST=db 등)
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 없습니다}
      TAGO_SERVICE_KEY: ${TAGO_SERVICE_KEY:-}          # 없으면 가짜 데이터
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy                     # db 가 healthy 가 된 뒤에 시작
    # 건강 검사는 이미지의 HEALTHCHECK(/api/healthz)를 그대로 쓴다

  web:
    <<: *common
    image: ${IMAGE_PREFIX:-}bus-web:${IMAGE_TAG:-step2.3}
    build: ./app/web
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      app:
        condition: service_healthy                     # Nginx 는 시작할 때 app 이름을 찾으므로 app 이 먼저
    # APP_ADDR=app:8000 은 이미지 기본값 (서비스 이름 = 주소)

volumes:
  db-data:
    name: bus-db-data
    external: true            # step2.0 ~ 2.3 에서 만든 볼륨을 그대로 쓴다 (compose down -v 로도 지워지지 않음)
