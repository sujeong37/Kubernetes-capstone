# step3.11 — app · web 전용 ServiceAccount
#   지금까지는 namespace 의 default SA 를 썼고, 그 토큰이 Pod 안 /var/run/secrets/kubernetes.io/serviceaccount 에 자동으로 들어갔다
#   app · web 은 Kubernetes API 를 부르지 않는다 → 토큰 자체를 넣지 않는다 (털려도 API 에 쓸 자격 증명이 없음)
#   Role · RoleBinding 을 만들지 않는다 = 권한 0 (최소 권한)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: bus
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: bus
automountServiceAccountToken: false
