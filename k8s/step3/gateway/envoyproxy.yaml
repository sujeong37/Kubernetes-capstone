# step3.8 — Envoy 프록시 Pod · Service 모양 (수업은 MetalLB 로 LoadBalancer, 우리는 EC2 라 NodePort)
#   AWS VPC 는 MetalLB L2(ARP) 광고를 전달하지 않고, kubeadm 에는 클라우드 LB 컨트롤러가 없다
#   → Envoy 앞 Service 를 NodePort 로. 보안 그룹은 3.0 부터 내 IP 에만 30000-32767 이 열려 있다
#   replicas 2 : 프록시가 하나면 그 Pod 가 곧 단일 장애점
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: proxy
  namespace: bus
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:              # step3.10 — 기본 요청 cpu 100m · mem 512Mi 는 실제 사용량(kubectl top)보다 훨씬 크다
            requests:             #   t3.medium(4GB) 에서 자리를 낭비하지 않게 실측 기준으로 줄인다
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      envoyService:
        type: NodePort
