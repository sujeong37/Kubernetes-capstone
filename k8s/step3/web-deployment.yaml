# step3.5 — Web (Nginx: 화면 + /api 를 app 으로). compose 의 web 서비스를 Kubernetes 로
#   compose 에서는 app 이 healthy 가 된 뒤 web 을 띄웠다 (Nginx 가 시작할 때 app 의 IP 를 찾아 고정하므로).
#   Kubernetes 에서는 app 이 Service(고정 ClusterIP) 라서 Pod 가 바뀌어도 IP 가 같다 → 기다리지 않아도 된다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: bus
  labels:
    app: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: web
      securityContext:
        runAsNonRoot: true            # 이미지의 USER 101 (2.1) · 포트 8080
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: sujeong79/bus-web:step2.3
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: APP_ADDR              # 이미지 기본값과 같지만 어디로 보내는지 매니페스트에 드러낸다
          value: app:8000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
