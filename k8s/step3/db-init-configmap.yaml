# step3.4 — 빈 데이터 디렉터리로 처음 시작할 때 MySQL 공식 이미지가 실행하는 SQL (app/db 와 같은 내용)
#   compose 의 ./app/db:/docker-entrypoint-initdb.d:ro 마운트와 같은 역할. 비밀값이 없으므로 Git 에 둔다
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
  namespace: bus
data:
  init.sql: |
    -- 즐겨찾기 정류장 테이블 (MySQL 8.4)
    CREATE TABLE IF NOT EXISTS favorites (
        node_id    VARCHAR(40)  NOT NULL PRIMARY KEY,                -- 정류장 ID (예: DJB8001793)
        node_name  VARCHAR(100) NOT NULL,                            -- 정류장 이름 (예: 북대전농협)
        alias      VARCHAR(100) NOT NULL,                            -- 사용자가 붙인 별명 (수정 가능)
        created_at TIMESTAMP    NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP    NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
    ) DEFAULT CHARSET = utf8mb4;
  grants.sql: |
    -- 2단계(컨테이너)부터 사용: MySQL 공식 이미지가 데이터가 빈 상태로 처음 시작할 때 실행한다 (/docker-entrypoint-initdb.d).
    -- 이미지는 MYSQL_USER(bus)에게 busdb 전체 권한(ALL: 표 생성 · 삭제 포함)을 준다.
    -- 1단계(1-3)와 같은 최소 권한(데이터 읽기 · 쓰기 · 수정 · 삭제)으로 줄인다.
    REVOKE ALL PRIVILEGES ON busdb.* FROM 'bus'@'%';
    GRANT SELECT, INSERT, UPDATE, DELETE ON busdb.* TO 'bus'@'%';
