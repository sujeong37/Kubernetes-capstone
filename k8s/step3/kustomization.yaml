# step3.12 — Kustomize: k8s/step3 의 매니페스트 묶음을 「한 단위」로 다룬다 (kubectl 에 내장, 별도 설치 없음)
#   kubectl kustomize k8s/step3   → 합쳐진 YAML 보기
#   kubectl diff -k k8s/step3     → Git 과 클러스터의 차이 (없으면 출력 없음 · 종료 코드 0)
#   kubectl apply -k k8s/step3    → 전부 한 번에 적용 (3.4~3.11 에서 파일마다 하던 apply 를 대신)
# Secret(bus-db · bus-tago)은 넣지 않는다 — 비밀값은 Git 에 없고 create-secrets.sh 로 만든다 (3.4)
# 공통 라벨(labels/commonLabels)도 넣지 않는다 — selector 가 바뀌면 Deployment 를 다시 만들어야 한다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
# DB (3.4)
- db-pvc.yaml
- db-init-configmap.yaml
- db-deployment.yaml
- db-service.yaml
# app · web (3.5 · 3.6)
- app-configmap.yaml
- app-deployment.yaml
- app-service.yaml
- web-deployment.yaml
- web-service.yaml
# Gateway (3.8)
- gateway/gatewayclass.yaml
- gateway/envoyproxy.yaml
- gateway/gateway.yaml
- gateway/httproute.yaml
# PDB (3.10)
- pdb.yaml
# ServiceAccount · NetworkPolicy (3.11)
- security/serviceaccounts.yaml
- security/networkpolicy.yaml
