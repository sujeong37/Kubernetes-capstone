# step4.0.3 — EC2 클러스터에서 ECR 이미지 쓰기 (base = 3단계 k8s/step3 그대로, 이미지 주소 · 태그만)
#   ACCOUNT_ID 는 자리 표시다 — 계정 ID 는 비밀 값이라 Git 에 넣지 않는다.
#   적용: bash infra/step4/node/apply-ec2-ecr.sh  (cp 의 IMDS 에서 계정 ID 를 읽어 바꿔 넣고 apply)
#   태그 aaa4404 = 소스를 마지막으로 바꾼 커밋 (4.0.2 에서 ECR 에 올림). EKS overlay(4.3) 도 같은 태그를 쓴다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../step3
images:
- name: sujeong79/bus-app
  newName: ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/bus-app
  newTag: aaa4404
- name: sujeong79/bus-web
  newName: ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/bus-web
  newTag: aaa4404
