# ② 3.5 의 wait-db 는 `nc -z db 3306` 을 그대로 적어 두었다 → RDS 주소를 기다리게 바꾼다
#   Pod 템플릿이 바뀌므로 이 overlay 를 적용하면 app 이 롤링으로 다시 뜬다 (ConfigMap 만 바꾸면 env 는 옛 값 그대로)
- op: replace
  path: /spec/template/spec/initContainers/0/args/0
  value: until nc -z -w 2 RDS_HOST 3306; do echo "$(date +%T) waiting for RDS_HOST:3306"; sleep 3; done; echo "$(date +%T) RDS_HOST:3306 is ready"
