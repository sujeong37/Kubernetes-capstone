# ⑥ 3.11: app 은 web Pod 와 Envoy 프록시(envoy-gateway-system)에서만 8000.
#   EKS: ALB 는 namespace 가 아니라 VPC 공용 서브넷(10.20.0.0/19 · 10.20.32.0/19 = 10.20.0.0/18)의 주소에서 Pod IP 로 들어온다
#   → namespaceSelector 대신 ipBlock. ALB 상태 확인도 같은 길로 온다
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-from-web-and-gateway
  namespace: bus
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: web
    - ipBlock:
        cidr: 10.20.0.0/18
    ports:
    - port: 8000
