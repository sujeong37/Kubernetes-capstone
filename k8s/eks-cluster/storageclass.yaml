# step4.2 — EBS StorageClass (EKS Auto Mode 는 StorageClass 를 만들어 두지 않는다 → 직접 만든다)
#   provisioner ebs.csi.eks.amazonaws.com : Auto Mode 에 내장된 EBS CSI (직접 설치한 ebs.csi.aws.com 과 이름이 다르다)
#   gp3 · 암호화 : gp2 보다 GB당 싸고 기본 3000 IOPS. 디스크를 AWS 관리 키로 암호화
#   WaitForFirstConsumer : PVC 만으로는 디스크를 만들지 않고, Pod 가 노드에 배치된 뒤 그 노드의 가용 영역에 만든다
#     (EBS 는 한 영역에만 붙는다 — 먼저 만들면 Pod 가 다른 영역 노드에 뜰 때 붙일 수 없다)
#   기본 StorageClass : storageClassName 을 생략한 PVC(3단계 db-pvc.yaml)가 이것을 쓴다. 3단계의 local-path 자리
#   reclaimPolicy Delete : PVC 를 지우면 EBS 도 지운다 (4.9 정리에서 남는 디스크 없음). Pod 교체 · 노드 교체로는 지워지지 않는다
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.eks.amazonaws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
allowedTopologies:
- matchLabelExpressions:
  - key: eks.amazonaws.com/compute-type
    values: [auto]
